
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive image slider built with vanilla JavaScript.">
    <title>Image Slider Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <header class="page-header">
        <h1>Image Slider Library</h1>
        <p>A responsive image slider built with HTML, CSS, and JavaScript.</p>
    </header>

    <main>
        <section class="slider-section" aria-label="Image gallery">
            <div class="slider" id="image-slider">
                <div class="slider-viewport">
                    <div class="slider-track" id="slider-track">

                        <div class="slide">
                            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                                alt="Green mountain landscape">
                        </div>

                        <div class="slide">
                            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                                alt="Mountain scenery reflected in a lake">
                        </div>

                        <div class="slide">
                            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
                                alt="Sunlight passing through a green forest">
                        </div>

                        <div class="slide">
                            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=85"
                                alt="Blue ocean waves along a sandy beach">
                        </div>

                        <div class="slide">
                            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85"
                                alt="Tall mountain peaks under a clear sky">
                        </div>

                    </div>
                </div>

                <button class="slider-button previous-button"
                    id="previous-button" type="button"
                    aria-label="Previous image">&#10094;</button>

                <button class="slider-button next-button"
                    id="next-button" type="button"
                    aria-label="Next image">&#10095;</button>

                <div class="slider-dots" id="slider-dots"
                    aria-label="Choose an image"></div>

                <p class="slide-counter" id="slide-counter"
                    aria-live="polite">1 / 5</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Image Slider Library | HTML, CSS and Vanilla JavaScript</p>
    </footer>

</body>
</html>
